<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <style>
    th, td{
      border: 1px solid;
      padding: 5px;
    }
    th{
      background-color: powderblue;
    }
  </style>
</head>
<body style="font-family: Inter;" ng-app="studentApp" ng-controller="StudentController">
  <h2>Student Management System</h2>
  <h3>Student Registration</h3>
  <form ng-submit="student.id ? updateStudent() : saveStudent()">
    <label>Name</label>
    <input type="text" ng-model="student.name" required>
    <br><br>
    <label>Email</label>
    <input type="email" ng-model="student.email" required>
    <br><br>
    <label>Age</label>
    <input type="number" ng-model="student.age" required>
    <br><br>
    <label>Course</label>
    <select ng-model="student.course" required>
      <option value="AngularJS">AngularJS</option>
      <option value="Java">Java</option>
      <option value="Python">Python</option>
      <option value="Spring Boot">Spring Boot</option>
    </select>
    <br><br>
    <button type="submit">{{ student.id ? "Update Student" : "Add Student" }}</button>
    <button type="button" ng-click="student = {}">Clear</button>
  </form>
  <h2>Student List</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Course</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="s in students track by $index">
        <td>{{s.id}}</td>
        <td>{{s.name}}</td>
        <td>{{s.email}}</td>
        <td>{{s.age}}</td>
        <td>{{s.course}}</td>
        <td>
          <button ng-click="editStudent(s.id)">Edit</button>
          <button ng-click="deleteStudent(s.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js" integrity="sha512-KZmyTq3PLx9EZl0RHShHQuXtrvdJ+m35tuOiwlcZfs/rE7NZv29ygNA8SFCkMXTnYZQK2OX0Gm2qKGfvWEtRXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app/app.js"></script>
  <script src="controllers/studentController.js"></script>
  <script src="services/studentService.js"></script>
</body>
</html>
